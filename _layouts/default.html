<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="{{ site.description }}" />
    <title>{{ page.title | default: site.title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ "/styles.css" | relative_url }}" />
  </head>
  <body>
    <header class="site-header">
      <nav class="topbar" aria-label="Navegación principal">
        <a href="{{ "/" | relative_url }}" class="brand">marcosba</a>
        <div class="nav-links">
          <a href="{{ "/" | relative_url }}#inicio">inicio</a>
          <a href="{{ "/" | relative_url }}#escritos">escritos</a>
          <a href="{{ "/" | relative_url }}#proyectos">proyectos</a>
          <a href="{{ "/sobre/" | relative_url }}">sobre</a>
        </div>
      </nav>
    </header>

    {{ content }}

    <footer style="max-width:820px;margin:48px auto 72px;color:var(--muted);font-size:0.92rem;padding:0 20px;">
      <p>© {{ site.title }} — Contenido y código bajo la licencia del autor.</p>
    </footer>
  </body>
</html>
