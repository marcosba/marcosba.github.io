<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | truncate: 160 }}" />
    <title>{{ page.title | default: site.title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ "/styles.css" | relative_url }}" />
  </head>
  <body>
    <header class="site-header">
      <nav class="topbar" aria-label="Navegación principal">
        <a href="{{ "/" | relative_url }}" class="brand">marcosba</a>
        <div class="nav-links">
          <a href="{{ "/" | relative_url }}">home</a>
          <a href="{{ "/blog/" | relative_url }}">blog</a>
          <a href="{{ "/about/" | relative_url }}">about</a>
          <a href="{{ "/more/" | relative_url }}">more</a>
        </div>
      </nav>
    </header>

    <main class="page-shell">
      <article class="post-article">
        <div class="section-title-wrap">
          <p class="section-kicker">escrito</p>
          <h1>{{ page.title }}</h1>
        </div>

        <p class="post-meta">{{ page.date | date: "%d %B %Y" }}</p>
        {{ content }}
      </article>
    </main>

    <footer class="site-footer">
      <p>© {{ site.title }} — contenido y código bajo la licencia del autor.</p>
    </footer>
  </body>
</html>
